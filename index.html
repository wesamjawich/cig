<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cig</title>
<style>
  html, body { margin: 0; height: 100%; background: #060607; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: grab; transition: opacity .35s ease; }
  canvas.dragging { cursor: grabbing; }
  canvas.fade { opacity: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.55) 100%); }
  #ui { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; gap: 8px; user-select: none; -webkit-user-select: none; }
  #ui button { font: 500 11px/1 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif;
    letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.72);
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
    padding: 11px 18px; border-radius: 999px; cursor: pointer; touch-action: none;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background .15s, color .15s, border-color .15s, opacity .25s, transform .1s; }
  #ui button:hover:not(:disabled) { background: rgba(255,255,255,.1); color: #fff; }
  #ui button:active:not(:disabled), #ui button.on { background: rgba(255,140,60,.22);
    border-color: rgba(255,150,80,.5); color: #fff; transform: scale(.97); }
  #ui button:disabled { opacity: .28; cursor: default; }
  #ui button:focus-visible { outline: 1px solid rgba(255,170,110,.8); outline-offset: 2px; }
  #ui button[hidden] { display: none; }
  #ui #pop { color: #c9fff0; border-color: rgba(120,240,200,.35); }
  #hud { position: fixed; left: 22px; top: 18px; user-select: none; pointer-events: none;
    font: 500 11px/1.6 ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", sans-serif; letter-spacing: .08em;
    text-transform: uppercase; color: rgba(255,255,255,.5); }
  #hud b { color: rgba(255,255,255,.88); font-weight: 600; font-variant-numeric: tabular-nums; }
  #hud span { display: block; color: rgba(255,255,255,.32); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hud"></div>
<div id="ui">
  <button id="light" title="L">Light</button>
  <button id="drag" title="Hold — or scroll / hold Space">Drag</button>
  <button id="ash" title="A">Ash</button>
  <button id="stub" title="S">Stub</button>
  <button id="pop" title="P — crush the menthol capsule" hidden>Pop</button>
  <button id="stats" title="T — or click the pack. B cycles brands">Stats</button>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
